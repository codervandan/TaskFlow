      name="keywords"
      content="task management, productivity, to-do list, task organizer, task tracker"

  <body class="page">
    <!-- Application interface goes here -->
    <header class="header">
      <h1 class="header__title">TaskFlow</h1>
    </header>
    <main class="main">
      <section class="todo">
        <h2 class="todo__title">My Tasks</h2>
        <p class="todo__description">Stay organized and get things done.</p>
        <form class="task-form" id="task-form">
          <label class="task-form__label" for="task-input"
            >Add a new task:</label
          >
          <input
            class="task-form__input"
            type="text"
            id="task-input"
            name="task"
            placeholder="Enter your task here..."
            minlength="2"
            maxlength="100"
            aria-describedby="task-input-error"
            required
          />
          <p
            class="task-form__error"
            id="task-input-error"
            role="alert"
            hidden
          ></p>
          <button class="task-form__button" type="submit">Add Task</button>
        </form>
        <p class="todo__storage-warning" role="alert" hidden>
          Your changes could not be saved. They may be lost when you refresh the
          page.
        </p>
        <div class="todo__tasks">
          <h3 class="todo__subtitle">Your Tasks</h3>
          <ul class="todo__list">
            <p class="todo__empty" hidden>
              No tasks yet. Add a task above to get started.
